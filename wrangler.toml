name = "lightphotos-app"
pages_build_output_dir = "dist"

# Required once the project has Functions (functions/api/e.js).
compatibility_date = "2026-09-21"

# Event store for the first-party analytics pipeline. Create the database once
# with `npx wrangler d1 create lightphotos_analytics` and paste the id it
# prints below, then apply migrations/0001_init.sql.
[[d1_databases]]
binding = "ANALYTICS"
database_name = "lightphotos_analytics"
database_id = "c449f9c2-1aca-4dec-ba1b-3a05a322a9a4"

<html lang="en">
<head>
<meta charset="utf-8" />
<script>
(function () {
  try {
    var t = localStorage.getItem('lp-theme');
    if (t === 'light' || t === 'neutral' || t === 'dark') {
      document.documentElement.setAttribute('data-theme', t);
    }
  } catch (e) {}
})();
</script>
